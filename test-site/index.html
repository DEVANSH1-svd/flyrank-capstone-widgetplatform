<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Customer site (second origin)</title>
  <style>body{font-family:system-ui,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem}code{background:#f3f3f3;padding:2px 4px}</style>
</head>
<body>
  <h1>Acme Coffee: a customer's website</h1>
  <p>This page is served from a different origin than the API. Open it as <code>?widget=PUBLIC_ID</code>.</p>
  <div id="slot"></div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var widgetId = params.get("widget");
      var api = params.get("api") || "http://127.0.0.1:8000";
      var slot = document.getElementById("slot");
      if (!widgetId) { slot.textContent = "Add ?widget=PUBLIC_ID to the URL."; return; }
      // Builds the same script element a customer would paste as a one-line snippet.
      var tag = document.createElement("script");
      tag.src = api + "/static/widget.v1.js";
      tag.setAttribute("data-widget-id", widgetId);
      slot.appendChild(tag);
    })();
  </script>
</body>
</html>
